<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OverView</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>OverView</h1>
    <p>View all devices connected to your network</p>
    <section>
        <h2>Backend connection</h2>
        <p id="backend-status">Checking connection...</p>
        <p id="backend-message"></p>
    </section>
    <button id="scanButton">Scan!</button>
    <p id="scanStatus">Ready to scan</p>
    <span id="deviceCount">0 devices</span>
    <ul id="deviceList"></ul>
    <section>
        <svg id="map" viewBox="0 0 800 600">
            <circle cx="400" cy="300" r="45" fill="#2564eb"/>
            <text x="400" y="365" text-anchor="middle" fill="black">Wifi Router</text>
        </svg> 
    </section>
    <script src="app.js"></script>
</body>
</html>
